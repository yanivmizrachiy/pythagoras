<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>משפט פיתגורס — חוברת מעוצבת</title>
<style>
:root{font-family:Rubik,Arial,sans-serif;color:#17223b;background:#eef2f7;--book-blue:#173f7a}
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#17223b}.top{position:sticky;top:0;z-index:9999;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:9px 12px;background:#fff;border-bottom:1px solid #d9e0ea;box-shadow:0 2px 14px #17223b0d}.top button{border:1px solid #cfd7e4;background:#fff;color:#17223b;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}.top button:disabled{opacity:.35;cursor:default}.top .print-color{background:var(--book-blue);border-color:var(--book-blue);color:#fff}.top .print-mono{background:#202020;border-color:#202020;color:#fff}.counter{min-width:100px;text-align:center;font-weight:700}.sync{font-size:12px;color:#667085;white-space:nowrap}.print-actions{display:flex;gap:8px;margin-inline-start:8px;padding-inline-start:8px;border-inline-start:1px solid #e2e7ef}.stage{padding:18px 8px 36px}.paper{width:min(210mm,calc(100vw - 16px));margin:auto;background:#fff;box-shadow:0 12px 35px #26354d22;overflow:hidden;position:relative}.loading{display:grid;place-items:center;min-height:75vh;text-align:center;padding:30px}.err{color:#9c1c1c;white-space:pre-wrap}.paper-inner{position:relative}.fallback{padding:0!important;margin:0!important;font-size:inherit!important;line-height:normal!important}.preview-fit{position:relative;margin:auto;overflow:visible}#printHost{display:none}
@media(max-width:700px){.stage{padding:8px 4px}.paper{width:100%;box-shadow:none}.top{padding:7px 6px;gap:6px}.top button{padding:7px 9px;font-size:13px}.counter{min-width:78px;font-size:13px}.sync{width:100%;text-align:center}.print-actions{width:100%;justify-content:center;flex-wrap:wrap;margin:2px 0 0;padding:7px 0 0;border-inline-start:0;border-top:1px solid #edf0f5}}
@media print{@page{size:A4;margin:0}html,body{margin:0!important;padding:0!important;background:#fff!important}.top,.stage{display:none!important}#printHost{display:block!important;width:210mm!important;margin:0!important;padding:0!important;background:#fff!important}.print-page{width:210mm!important;height:297mm!important;min-height:297mm!important;margin:0!important;padding:0!important;background:#fff!important;overflow:hidden!important;break-after:page;page-break-after:always}.print-page:last-child{break-after:auto;page-break-after:auto}.print-page .fallback,.print-page .a4-page{margin:0!important}.book-theme-original .fallback,.book-theme-color .fallback,.book-theme-mono .fallback{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<link rel="stylesheet" href="https://yanivmizrachiy.github.io/pythagoras/book-design.css?v=6">
<script src="https://yanivmizrachiy.github.io/pythagoras/book-design.js?v=5"></script>
<script>MathJax={tex:{inlineMath:[["\\(","\\)"]]},chtml:{fontURL:'https://aaa-pythagoras.vercel.app/vendor/mathjax/tex-font/chtml/woff2'}};</script>
<script defer src="https://aaa-pythagoras.vercel.app/vendor/mathjax/tex-mml-chtml.js"></script>
</head>
<body>
<nav class="top" aria-label="ניווט והדפסה"><button id="prev">הקודם</button><span class="counter" id="counter">טוען…</span><button id="next">הבא</button><span class="sync" id="syncStatus">מסנכרן את הדפים החיים…</span><div class="print-actions"><button id="printOriginal">הדפסה בעיצוב המקורי</button><button id="printColor" class="print-color">הדפסה בצבע</button><button id="printMono" class="print-mono">הדפסה בשחור־לבן</button></div></nav>
<main class="stage"><section class="paper"><div id="app" class="loading">טוען את כל דפי פיתגורס המעודכנים…</div></section></main><section id="printHost" aria-hidden="true"></section>
<script>
(()=>{'use strict';
const SOURCE='https://aaa-pythagoras.vercel.app/';
const app=document.getElementById('app'),paper=document.querySelector('.paper'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next'),syncStatus=document.getElementById('syncStatus'),printHost=document.getElementById('printHost');
const printOriginal=document.getElementById('printOriginal'),printColor=document.getElementById('printColor'),printMono=document.getElementById('printMono');
let manifest=null,pages=[],idx=0,pageCache=new Map();const styleLinks=new Map();
const absolute=(p)=>new URL(p,SOURCE).href;const bust=(p)=>{const u=new URL(p,SOURCE);u.searchParams.set('_live',Date.now());return u.href};
async function fetchText(path){const r=await fetch(bust(path),{cache:'no-store'});if(!r.ok)throw new Error(path+' — HTTP '+r.status);return r.text()}
async function fetchJson(path){return JSON.parse(await fetchText(path))}
function hashText(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}
function cssPath(meta){return 'styles/pages/'+meta.file.replace(/\.html$/i,'.css')}
function ensureLink(key,href,force=false){return new Promise((resolve,reject)=>{if(force&&styleLinks.has(key)){styleLinks.get(key).remove();styleLinks.delete(key)}if(styleLinks.has(key))return resolve(styleLinks.get(key));const l=document.createElement('link');l.rel='stylesheet';l.href=href;l.dataset.liveStyle=key;l.onload=()=>{styleLinks.set(key,l);resolve(l)};l.onerror=()=>{l.remove();reject(new Error('CSS נכשל: '+key))};document.head.append(l)})}
async function loadSharedStyles(force=false){const stamp=Date.now();await Promise.all(['vendor/fonts/rubik.css','styles/a4-base.css','styles/topics/pythagoras.css','styles/pythagoras-workbook.css'].map(p=>ensureLink('shared:'+p,absolute(p)+'?live='+stamp,force)))}
async function loadPageStyle(meta,force=false){return ensureLink('page:'+meta.file,absolute(cssPath(meta))+'?live='+Date.now(),force)}
function absolutizeAssets(root){const attrs=['src','poster','data-src','href','xlink:href'];root.querySelectorAll('*').forEach(el=>attrs.forEach(a=>{if(!el.hasAttribute(a))return;const v=el.getAttribute(a);if(!v||v.startsWith('#')||/^(?:data:|blob:|javascript:|mailto:|tel:|https?:)/i.test(v))return;try{el.setAttribute(a,absolute(v))}catch{}}))}
function namespaceSvgIds(root,prefix){const map=new Map();root.querySelectorAll('[id]').forEach(el=>{const old=el.id,nu=prefix+'-'+old;map.set(old,nu);el.id=nu});if(!map.size)return;const urlAttrs=['href','xlink:href','fill','stroke','filter','clip-path','mask','marker-start','marker-mid','marker-end'];const tokenAttrs=['aria-labelledby','aria-describedby','aria-controls','aria-owns','headers'];root.querySelectorAll('*').forEach(el=>{urlAttrs.forEach(a=>{if(!el.hasAttribute(a))return;let v=el.getAttribute(a);map.forEach((nu,old)=>v=v.replaceAll('#'+old,'#'+nu));el.setAttribute(a,v)});tokenAttrs.forEach(a=>{if(!el.hasAttribute(a))return;el.setAttribute(a,el.getAttribute(a).split(/\s+/).map(id=>map.get(id)||id).join(' '))})})}
function normalizeHtml(html,meta,i){const doc=new DOMParser().parseFromString(html,'text/html');const main=doc.querySelector('main.a4-page');if(!main)throw new Error(meta.file+' — לא נמצא main.a4-page');main.classList.add('pythagoras-workbook-page');main.dataset.sourcePage=String(meta.sourceNumber??meta.number??'');main.dataset.workbookPage=String(i+1);main.dataset.primaryTopic=meta.primaryTopic||'משפט פיתגורס';const pn=main.querySelector('.page-number');if(pn)pn.textContent=String(i+1);absolutizeAssets(main);namespaceSvgIds(main,'live-'+(i+1));return '<div class="fallback" data-local-page-id="'+String(i+1).padStart(3,'0')+'" data-source-file="'+meta.file+'">'+main.outerHTML+'</div>'}
async function getPage(i,force=false){const meta=pages[i];if(!force&&pageCache.has(meta.file))return pageCache.get(meta.file);const html=await fetchText(meta.file),markup=normalizeHtml(html,meta,i);pageCache.set(meta.file,{html,markup,hash:hashText(html)});return pageCache.get(meta.file)}
async function validateAllPages(){let done=0;const queue=pages.map((_,i)=>i),workers=Array.from({length:Math.min(6,pages.length)},async()=>{while(queue.length){const i=queue.shift();await Promise.all([loadPageStyle(pages[i]),getPage(i,true)]);done++;syncStatus.textContent='בודק דפים חיים '+done+' / '+pages.length}});await Promise.all(workers)}
function applyDesign(scope){window.PythagorasBookDesign?.apply(scope)}
async function typeset(scope){try{if(window.MathJax?.startup?.promise)await window.MathJax.startup.promise;if(window.MathJax?.typesetClear)window.MathJax.typesetClear([scope]);if(window.MathJax?.typesetPromise)await window.MathJax.typesetPromise([scope])}catch(e){console.warn('MathJax',e)}}
function fitPreview(){const wrap=app.querySelector('.preview-fit'),page=wrap?.querySelector('.a4-page');if(!wrap||!page)return;page.style.zoom='';page.style.transform='';page.style.position='';wrap.style.width='';wrap.style.height='';const w=page.offsetWidth,h=page.offsetHeight,available=paper.clientWidth;if(!w||!h)return;const scale=Math.min(1,available/w);wrap.style.width=(w*scale)+'px';if(scale>=.999){wrap.style.height='auto';return}if(typeof CSS!=='undefined'&&CSS.supports?.('zoom','0.5')){page.style.zoom=String(scale);wrap.style.height=(h*scale)+'px'}else{wrap.style.height=(h*scale)+'px';page.style.position='absolute';page.style.left='0';page.style.top='0';page.style.transformOrigin='top left';page.style.transform='scale('+scale+')'}}
async function render(force=true){syncStatus.textContent='טוען את העמוד המעודכן…';await loadPageStyle(pages[idx],force);const data=await getPage(idx,force);app.className='paper-inner book-theme-original';app.innerHTML='<div class="preview-fit">'+data.markup+'</div>';applyDesign(app);counter.textContent='עמוד '+(idx+1)+' / '+pages.length;prev.disabled=idx===0;next.disabled=idx===pages.length-1;history.replaceState(null,'',location.pathname+location.search+'#'+(idx+1));await typeset(app);requestAnimationFrame(fitPreview);syncStatus.textContent='מסונכרן ישירות · '+pages.length+' דפים'}
async function prepareWorkbook(theme){syncStatus.textContent='מרענן את כל הדפים לפני הדפסה…';await loadSharedStyles(true);await Promise.all(pages.map(p=>loadPageStyle(p,true)));const fresh=[];for(let i=0;i<pages.length;i++){fresh.push((await getPage(i,true)).markup);if(i%5===0)syncStatus.textContent='מרענן להדפסה '+(i+1)+' / '+pages.length}printHost.className=theme==='mono'?'book-theme-mono':theme==='color'?'book-theme-color':'book-theme-original';printHost.innerHTML=fresh.map(m=>'<article class="print-page">'+m+'</article>').join('');applyDesign(printHost);const audit=window.PythagorasBookDesign?.audit(printHost)||[];if(audit.length!==pages.length)throw new Error('בדיקת עיצוב: '+audit.length+' מתוך '+pages.length);await typeset(printHost);syncStatus.textContent='מוכן להדפסה · '+pages.length+' דפים'}
async function printWorkbook(theme){try{printOriginal.disabled=printColor.disabled=printMono.disabled=true;await prepareWorkbook(theme);requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()))}catch(e){alert('שגיאה בהכנת החוברת: '+e.message);console.error(e)}finally{printOriginal.disabled=printColor.disabled=printMono.disabled=false}}
async function checkForChanges(){try{const fresh=await fetchJson('WORKBOOK_MANIFEST.json');if(JSON.stringify(fresh.pages||[])!==JSON.stringify(manifest.pages||[])){syncStatus.textContent='מבנה החוברת השתנה — מעדכן…';location.reload();return}const current=await fetchText(pages[idx].file),h=hashText(current),old=pageCache.get(pages[idx].file)?.hash;if(old&&h!==old){pageCache.delete(pages[idx].file);syncStatus.textContent='העמוד השתנה — מעדכן…';await render(true)}}catch(e){console.debug('בדיקת סנכרון נדחתה',e)}}
async function boot(){manifest=await fetchJson('WORKBOOK_MANIFEST.json');pages=Array.isArray(manifest.pages)?manifest.pages:[];if(!pages.length)throw new Error('המניפסט אינו מכיל דפים');if(Number(manifest.totalPages)&&Number(manifest.totalPages)!==pages.length)throw new Error('מספר הדפים במניפסט אינו תואם');idx=Math.max(0,Math.min(pages.length-1,(parseInt(location.hash.slice(1),10)||1)-1));await loadSharedStyles();await validateAllPages();await render(false);setInterval(()=>{if(document.visibilityState==='visible')checkForChanges()},120000)}
prev.onclick=async()=>{if(idx>0){idx--;await render(true);scrollTo(0,0)}};next.onclick=async()=>{if(idx<pages.length-1){idx++;await render(true);scrollTo(0,0)}};printOriginal.onclick=()=>printWorkbook('original');printColor.onclick=()=>printWorkbook('color');printMono.onclick=()=>printWorkbook('mono');addEventListener('resize',()=>requestAnimationFrame(fitPreview),{passive:true});addEventListener('afterprint',()=>{printHost.innerHTML='';printHost.className='';syncStatus.textContent='מסונכרן ישירות · '+pages.length+' דפים'});addEventListener('keydown',async e=>{if(e.key==='ArrowLeft'&&idx<pages.length-1){idx++;await render(true)}else if(e.key==='ArrowRight'&&idx>0){idx--;await render(true)}});
boot().catch(e=>{app.className='loading err';app.textContent='שגיאה בטעינת החוברת:\n'+e.message;counter.textContent='שגיאה';syncStatus.textContent='טעינה נכשלה';printOriginal.disabled=printColor.disabled=printMono.disabled=true;console.error(e)});
})();
</script>
</body></html>
