<script>
(()=>{'use strict';
const SOURCE='https://aaa-pythagoras.vercel.app/';
const app=document.getElementById('app'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next'),syncStatus=document.getElementById('syncStatus'),printHost=document.getElementById('printHost');
const printOriginal=document.getElementById('printOriginal'),printColor=document.getElementById('printColor'),printMono=document.getElementById('printMono'),downloadOriginal=document.getElementById('downloadOriginal'),downloadColor=document.getElementById('downloadColor'),downloadMono=document.getElementById('downloadMono');
const actionButtons=[printOriginal,printColor,printMono,downloadOriginal,downloadColor,downloadMono];
let manifest=null,pages=[],idx=0,pageCache=new Map(),pageObserver=null;const styleLinks=new Map(),scriptPromises=new Map();
const absolute=(p)=>new URL(p,SOURCE).href;const bust=(p)=>{const u=new URL(p,SOURCE);u.searchParams.set('_live',Date.now());return u.href};
async function fetchText(path){const r=await fetch(bust(path),{cache:'no-store'});if(!r.ok)throw new Error(path+' — HTTP '+r.status);return r.text()}
async function fetchJson(path){return JSON.parse(await fetchText(path))}
function hashText(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}
function cssPath(meta){return 'styles/pages/'+meta.file.replace(/\.html$/i,'.css')}
function ensureLink(key,href,force=false){return new Promise((resolve,reject)=>{if(force&&styleLinks.has(key)){styleLinks.get(key).remove();styleLinks.delete(key)}if(styleLinks.has(key))return resolve(styleLinks.get(key));const l=document.createElement('link');l.rel='stylesheet';l.href=href;l.dataset.liveStyle=key;l.onload=()=>{styleLinks.set(key,l);resolve(l)};l.onerror=()=>{l.remove();reject(new Error('CSS נכשל: '+key))};document.head.append(l)})}
function loadScriptOnce(src,key){if(scriptPromises.has(key))return scriptPromises.get(key);const promise=new Promise((resolve,reject)=>{const existing=document.querySelector('script[data-pdf-lib="'+key+'"]');if(existing?.dataset.loaded==='true')return resolve();const s=existing||document.createElement('script');s.src=src;s.async=true;s.dataset.pdfLib=key;s.onload=()=>{s.dataset.loaded='true';resolve()};s.onerror=()=>{s.remove();scriptPromises.delete(key);reject(new Error('טעינת מנוע PDF נכשלה: '+key))};if(!existing)document.head.append(s)});scriptPromises.set(key,promise);return promise}
async function ensurePdfLibraries(){await loadScriptOnce('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js','html2canvas');await loadScriptOnce('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js','jspdf');if(!window.html2canvas||!window.jspdf?.jsPDF)throw new Error('מנוע PDF לא נטען')}
function setActionsDisabled(disabled){actionButtons.forEach(b=>b.disabled=disabled)}
async function loadSharedStyles(force=false){const stamp=Date.now();await Promise.all(['vendor/fonts/rubik.css','styles/a4-base.css','styles/topics/pythagoras.css','styles/pythagoras-workbook.css'].map(p=>ensureLink('shared:'+p,absolute(p)+'?live='+stamp,force)))}
async function loadPageStyle(meta,force=false){return ensureLink('page:'+meta.file,absolute(cssPath(meta))+'?live='+Date.now(),force)}
function absolutizeAssets(root){const attrs=['src','poster','data-src','href','xlink:href'];root.querySelectorAll('*').forEach(el=>attrs.forEach(a=>{if(!el.hasAttribute(a))return;const v=el.getAttribute(a);if(!v||v.startsWith('#')||/^(?:data:|blob:|javascript:|mailto:|tel:|https?:)/i.test(v))return;try{el.setAttribute(a,absolute(v))}catch{}}))}
function namespaceSvgIds(root,prefix){const map=new Map();root.querySelectorAll('[id]').forEach(el=>{const old=el.id,nu=prefix+'-'+old;map.set(old,nu);el.id=nu});if(!map.size)return;const urlAttrs=['href','xlink:href','fill','stroke','filter','clip-path','mask','marker-start','marker-mid','marker-end'];const tokenAttrs=['aria-labelledby','aria-describedby','aria-controls','aria-owns','headers'];root.querySelectorAll('*').forEach(el=>{urlAttrs.forEach(a=>{if(!el.hasAttribute(a))return;let v=el.getAttribute(a);map.forEach((nu,old)=>v=v.replaceAll('#'+old,'#'+nu));el.setAttribute(a,v)});tokenAttrs.forEach(a=>{if(!el.hasAttribute(a))return;el.setAttribute(a,el.getAttribute(a).split(/\s+/).map(id=>map.get(id)||id).join(' '))})})}
function normalizeHtml(html,meta,i){const doc=new DOMParser().parseFromString(html,'text/html');const main=doc.querySelector('main.a4-page');if(!main)throw new Error(meta.file+' — לא נמצא main.a4-page');main.classList.add('pythagoras-workbook-page');main.dataset.sourcePage=String(meta.sourceNumber??meta.number??'');main.dataset.workbookPage=String(i+1);main.dataset.primaryTopic=meta.primaryTopic||'משפט פיתגורס';const pn=main.querySelector('.page-number');if(pn)pn.textContent=String(i+1);absolutizeAssets(main);namespaceSvgIds(main,'live-'+(i+1));return '<div class="fallback" data-local-page-id="'+String(i+1).padStart(3,'0')+'" data-source-file="'+meta.file+'">'+main.outerHTML+'</div>'}
async function getPage(i,force=false){const meta=pages[i];if(!force&&pageCache.has(meta.file))return pageCache.get(meta.file);const html=await fetchText(meta.file),markup=normalizeHtml(html,meta,i);pageCache.set(meta.file,{html,markup,hash:hashText(html)});return pageCache.get(meta.file)}
async function validateAllPages(){let done=0;const queue=pages.map((_,i)=>i),workers=Array.from({length:Math.min(6,pages.length)},async()=>{while(queue.length){const i=queue.shift();await Promise.all([loadPageStyle(pages[i]),getPage(i,true)]);done++;syncStatus.textContent='בודק דפים חיים '+done+' / '+pages.length}});await Promise.all(workers)}
function applyDesign(scope){window.PythagorasBookDesign?.apply(scope)}
async function typeset(scope){try{if(window.MathJax?.startup?.promise)await window.MathJax.startup.promise;if(window.MathJax?.typesetClear)window.MathJax.typesetClear([scope]);if(window.MathJax?.typesetPromise)await window.MathJax.typesetPromise([scope])}catch(e){console.warn('MathJax',e)}}
function fitSheet(sheet){const wrap=sheet.querySelector('.preview-fit'),page=wrap?.querySelector('.a4-page');if(!wrap||!page)return;page.style.zoom='';page.style.transform='';page.style.position='';wrap.style.width='';wrap.style.height='';const w=page.offsetWidth,h=page.offsetHeight,available=sheet.clientWidth;if(!w||!h)return;const scale=Math.min(1,available/w);wrap.style.width=(w*scale)+'px';if(scale>=.999){wrap.style.height=h+'px';return}if(typeof CSS!=='undefined'&&CSS.supports?.('zoom','0.5')){page.style.zoom=String(scale);wrap.style.height=(h*scale)+'px'}else{wrap.style.height=(h*scale)+'px';page.style.position='absolute';page.style.left='0';page.style.top='0';page.style.transformOrigin='top left';page.style.transform='scale('+scale+')'}}
function fitAll(){app.querySelectorAll('.scroll-sheet').forEach(fitSheet)}
function updateCurrent(i,replaceHash=true){idx=Math.max(0,Math.min(pages.length-1,i));counter.textContent='עמוד '+(idx+1)+' / '+pages.length;prev.disabled=idx===0;next.disabled=idx===pages.length-1;app.querySelectorAll('.scroll-sheet.is-current').forEach(e=>e.classList.remove('is-current'));app.querySelector('.scroll-sheet[data-index="'+idx+'"]')?.classList.add('is-current');if(replaceHash)history.replaceState(null,'',location.pathname+location.search+'#'+(idx+1))}
function setupPageObserver(){pageObserver?.disconnect();pageObserver=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(!visible.length)return;const i=Number(visible[0].target.dataset.index);if(Number.isFinite(i)&&i!==idx)updateCurrent(i,true)},{root:null,rootMargin:'-22% 0px -48% 0px',threshold:[0,.2,.4,.6,.8]});app.querySelectorAll('.scroll-sheet').forEach(e=>pageObserver.observe(e))}
async function renderAll(force=false){syncStatus.textContent='בונה גלילה רציפה של '+pages.length+' דפים…';const chunks=[];for(let i=0;i<pages.length;i++){const data=await getPage(i,force);chunks.push('<article class="scroll-sheet" data-index="'+i+'" id="workbook-page-'+(i+1)+'"><div class="preview-fit">'+data.markup+'</div></article>')}app.className='scroll-stack book-theme-color';app.innerHTML=chunks.join('');applyDesign(app);await typeset(app);requestAnimationFrame(()=>{fitAll();setupPageObserver();updateCurrent(idx,false);if(idx>0)setTimeout(()=>app.querySelector('.scroll-sheet[data-index="'+idx+'"]')?.scrollIntoView({block:'start'}),30)});syncStatus.textContent='גלילה רציפה · '+pages.length+' דפים'}
function scrollToPage(i){const target=Math.max(0,Math.min(pages.length-1,i));updateCurrent(target,true);app.querySelector('.scroll-sheet[data-index="'+target+'"]')?.scrollIntoView({behavior:'smooth',block:'start'})}
async function refreshCurrentIfChanged(){const meta=pages[idx],old=pageCache.get(meta.file)?.hash,current=await fetchText(meta.file),h=hashText(current);if(!old||h===old)return false;const html=normalizeHtml(current,meta,idx);pageCache.set(meta.file,{html:current,markup:html,hash:h});await loadPageStyle(meta,true);const sheet=app.querySelector('.scroll-sheet[data-index="'+idx+'"]');if(sheet){sheet.innerHTML='<div class="preview-fit">'+html+'</div>';applyDesign(sheet);await typeset(sheet);requestAnimationFrame(()=>fitSheet(sheet))}return true}
async function prepareWorkbook(theme){syncStatus.textContent='מרענן את כל הדפים…';await loadSharedStyles(true);await Promise.all(pages.map(p=>loadPageStyle(p,true)));const fresh=[];for(let i=0;i<pages.length;i++){fresh.push((await getPage(i,true)).markup);if(i%5===0)syncStatus.textContent='מרענן '+(i+1)+' / '+pages.length}printHost.className=theme==='mono'?'book-theme-mono':theme==='color'?'book-theme-color':'book-theme-original';printHost.innerHTML=fresh.map(m=>'<article class="print-page">'+m+'</article>').join('');applyDesign(printHost);const audit=window.PythagorasBookDesign?.audit(printHost)||[];if(audit.length!==pages.length)throw new Error('בדיקת עיצוב: '+audit.length+' מתוך '+pages.length);await typeset(printHost);syncStatus.textContent='מוכן · '+pages.length+' דפים'}
async function printWorkbook(theme){try{setActionsDisabled(true);await prepareWorkbook(theme);requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()))}catch(e){alert('שגיאה בהכנת החוברת: '+e.message);console.error(e)}finally{setActionsDisabled(false)}}
function pdfFilename(theme){const suffix=theme==='mono'?'שחור-לבן':theme==='color'?'צבע':'מקורי';return 'משפט-פיתגורס-'+suffix+'.pdf'}
async function downloadPdf(theme){try{setActionsDisabled(true);await prepareWorkbook(theme);await ensurePdfLibraries();printHost.classList.add('pdf-rendering');printHost.setAttribute('aria-hidden','false');await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const nodes=[...printHost.querySelectorAll('.print-page')];if(nodes.length!==pages.length)throw new Error('נמצאו '+nodes.length+' דפים במקום '+pages.length);const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});for(let i=0;i<nodes.length;i++){syncStatus.textContent='יוצר PDF · עמוד '+(i+1)+' / '+nodes.length;const canvas=await window.html2canvas(nodes[i],{scale:1.35,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',logging:false,removeContainer:true});if(i>0)pdf.addPage('a4','portrait');const image=canvas.toDataURL('image/jpeg',0.92);pdf.addImage(image,'JPEG',0,0,210,297,undefined,'FAST');canvas.width=1;canvas.height=1;await new Promise(r=>setTimeout(r,0))}syncStatus.textContent='מוריד PDF…';pdf.save(pdfFilename(theme));syncStatus.textContent='ההורדה הושלמה · '+nodes.length+' דפים'}catch(e){alert('שגיאה בהורדת PDF: '+e.message);syncStatus.textContent='הורדת PDF נכשלה';console.error(e)}finally{printHost.classList.remove('pdf-rendering');printHost.setAttribute('aria-hidden','true');printHost.innerHTML='';printHost.className='';setActionsDisabled(false)}}
async function checkForChanges(){try{const fresh=await fetchJson('WORKBOOK_MANIFEST.json');if(JSON.stringify(fresh.pages||[])!==JSON.stringify(manifest.pages||[])){syncStatus.textContent='מבנה החוברת השתנה — מעדכן…';location.reload();return}if(await refreshCurrentIfChanged())syncStatus.textContent='העמוד המעודכן נטען מחדש'}catch(e){console.debug('בדיקת סנכרון נדחתה',e)}}
async function boot(){manifest=await fetchJson('WORKBOOK_MANIFEST.json');pages=Array.isArray(manifest.pages)?manifest.pages:[];if(!pages.length)throw new Error('המניפסט אינו מכיל דפים');if(Number(manifest.totalPages)&&Number(manifest.totalPages)!==pages.length)throw new Error('מספר הדפים במניפסט אינו תואם');idx=Math.max(0,Math.min(pages.length-1,(parseInt(location.hash.slice(1),10)||1)-1));await loadSharedStyles();await validateAllPages();await renderAll(false);setInterval(()=>{if(document.visibilityState==='visible')checkForChanges()},120000)}
prev.onclick=()=>scrollToPage(idx-1);next.onclick=()=>scrollToPage(idx+1);printOriginal.onclick=()=>printWorkbook('original');printColor.onclick=()=>printWorkbook('color');printMono.onclick=()=>printWorkbook('mono');downloadOriginal.onclick=()=>downloadPdf('original');downloadColor.onclick=()=>downloadPdf('color');downloadMono.onclick=()=>downloadPdf('mono');addEventListener('resize',()=>requestAnimationFrame(fitAll),{passive:true});addEventListener('afterprint',()=>{printHost.innerHTML='';printHost.className='';syncStatus.textContent='גלילה רציפה · '+pages.length+' דפים'});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')scrollToPage(idx+1);else if(e.key==='ArrowRight')scrollToPage(idx-1)});
boot().catch(e=>{app.className='loading err';app.textContent='שגיאה בטעינת החוברת:\n'+e.message;counter.textContent='שגיאה';syncStatus.textContent='טעינה נכשלה';setActionsDisabled(true);console.error(e)});
})();
</script>
</body></html>
