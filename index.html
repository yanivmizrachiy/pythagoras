<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>משפט פיתגורס — חוברת דיגיטלית</title>
<style>
:root{font-family:Arial,"Noto Sans Hebrew",sans-serif;color:#17223b;background:#eef2f7;--book-blue:#173f7a}
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#17223b}.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:9px 12px;background:#fff;border-bottom:1px solid #d9e0ea;box-shadow:0 2px 14px #17223b0d}.top button{border:1px solid #cfd7e4;background:#fff;color:#17223b;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;transition:transform .14s ease,box-shadow .14s ease}.top button:hover{transform:translateY(-1px);box-shadow:0 4px 12px #17223b18}.top button:disabled{opacity:.35;cursor:default}.top .print-original{background:#fff;border-color:#8d99aa}.top .print-color{background:var(--book-blue);border-color:var(--book-blue);color:#fff}.top .print-mono{background:#202020;border-color:#202020;color:#fff}.counter{min-width:92px;text-align:center;font-weight:700}.print-actions{display:flex;gap:8px;margin-inline-start:8px;padding-inline-start:8px;border-inline-start:1px solid #e2e7ef}.stage{padding:18px 8px 36px}.paper{width:min(210mm,calc(100vw - 16px));min-height:297mm;margin:auto;background:#fff;box-shadow:0 12px 35px #26354d22;overflow:hidden}.loading{display:grid;place-items:center;min-height:75vh;text-align:center;padding:30px}.err{color:#9c1c1c;white-space:pre-wrap}.paper-inner{min-height:297mm}.fallback{padding:14mm;font-size:15px;line-height:1.55}#printHost{display:none}
@media(max-width:700px){.stage{padding:8px 4px}.paper{width:100%;min-height:auto;box-shadow:none}.top{padding:7px 6px;gap:6px}.top button{padding:7px 9px;font-size:13px}.counter{min-width:78px;font-size:13px}.print-actions{width:100%;justify-content:center;flex-wrap:wrap;margin:2px 0 0;padding:7px 0 0;border-inline-start:0;border-top:1px solid #edf0f5}}
@media print{@page{size:A4;margin:0}html,body{margin:0!important;padding:0!important;background:#fff!important}.top,.stage{display:none!important}#printHost{display:block!important;width:210mm;margin:0!important;padding:0!important;background:#fff!important}.print-page{width:210mm;min-height:297mm;margin:0!important;padding:0!important;background:#fff!important;overflow:hidden;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}.print-page:last-child{break-after:auto;page-break-after:auto}.print-page .fallback{min-height:297mm;margin:0!important}.book-theme-original .fallback,.book-theme-color .fallback,.book-theme-mono .fallback{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<link rel="stylesheet" href="book-design.css?v=2">
<script src="book-design.js?v=1"></script>
</head>
<body>
<nav class="top" aria-label="ניווט והדפסה">
<button id="prev">הקודם</button><span class="counter" id="counter">טוען…</span><button id="next">הבא</button>
<div class="print-actions" aria-label="אפשרויות הדפסה"><button id="printOriginal" class="print-original">הדפסה בעיצוב המקורי</button><button id="printColor" class="print-color">הדפסה בצבע</button><button id="printMono" class="print-mono">הדפסה בשחור־לבן</button></div>
</nav>
<main class="stage"><section class="paper"><div id="app" class="loading">טוען את 53 דפי פיתגורס…</div></section></main>
<section id="printHost" aria-hidden="true"></section>
<script>
(async()=>{
 const app=document.getElementById('app'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');
 const printOriginal=document.getElementById('printOriginal'),printColor=document.getElementById('printColor'),printMono=document.getElementById('printMono'),printHost=document.getElementById('printHost');
 try{
  const base='https://raw.githubusercontent.com/yanivmizrachiy/pythagoras/main/.bootstrap/part-';
  const parts=await Promise.all(['000','001','002'].map(async n=>{const r=await fetch(base+n,{cache:'no-store'});if(!r.ok)throw new Error('bootstrap part '+n+' HTTP '+r.status);return(await r.text()).trim()}));
  const b64=parts.join('').replace(/\s+/g,''),bin=atob(b64),gz=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)gz[i]=bin.charCodeAt(i);
  if(!('DecompressionStream'in window))throw new Error('הדפדפן אינו תומך ב-DecompressionStream');
  const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip')),tar=new Uint8Array(await new Response(stream).arrayBuffer()),dec=new TextDecoder('utf-8'),files=new Map();
  const text=(a,b)=>dec.decode(tar.subarray(a,b)).replace(/\0.*$/s,'').trim();let p=0;
  while(p+512<=tar.length){let nonzero=false;for(let i=p;i<p+512;i++){if(tar[i]){nonzero=true;break}}if(!nonzero)break;const name=text(p,p+100),prefix=text(p+345,p+500),full=(prefix?prefix+'/':'')+name,sizeRaw=text(p+124,p+136).replace(/\0/g,'').trim(),size=parseInt(sizeRaw||'0',8)||0,type=String.fromCharCode(tar[p+156]||48),start=p+512,end=start+size;if(type==='0'||type==='\0')files.set(full,tar.slice(start,end));p=start+Math.ceil(size/512)*512}
  const keys=[...files.keys()],pages=keys.filter(k=>/^src\/pages\/\d{3}\/main\.html$/.test(k)).sort();if(pages.length!==53)throw new Error('נמצאו '+pages.length+' דפים במקום 53');
  const cssKeys=keys.filter(k=>/^src\/shared\/.*\.css$/.test(k)).sort((a,b)=>{const rank=k=>/design-tokens/.test(k)?0:/textbook/.test(k)?1:/viewer/.test(k)?2:/print/.test(k)?3:4;return rank(a)-rank(b)}),css=cssKeys.map(k=>dec.decode(files.get(k))).join('\n');
  let idx=Math.max(0,Math.min(52,(parseInt(location.hash.slice(1),10)||1)-1));
  function bodyOnly(html){const m=html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);return m?m[1]:html.replace(/<!doctype[^>]*>/ig,'').replace(/<html[^>]*>|<\/html>|<head[\s\S]*?<\/head>/ig,'')}
  function pageMarkup(i){const raw=dec.decode(files.get(pages[i]));return'<style>'+css+'\nbody{margin:0}.preview-nav{display:none!important}</style><div class="fallback" data-local-page-id="'+String(i+1).padStart(3,'0')+'">'+bodyOnly(raw)+'</div>'}
  function applyDesign(scope){if(window.PythagorasBookDesign)window.PythagorasBookDesign.apply(scope)}
  function render(){app.className='paper-inner book-theme-original';app.innerHTML=pageMarkup(idx);applyDesign(app);counter.textContent='עמוד '+(idx+1)+' / 53';prev.disabled=idx===0;next.disabled=idx===52;history.replaceState(null,'','#'+(idx+1))}
  function prepareWorkbook(theme){printHost.className=theme==='mono'?'book-theme-mono':theme==='color'?'book-theme-color':'book-theme-original';printHost.innerHTML=pages.map((_,i)=>'<article class="print-page">'+pageMarkup(i)+'</article>').join('');applyDesign(printHost);document.documentElement.dataset.printTheme=theme;const audit=window.PythagorasBookDesign?window.PythagorasBookDesign.audit(printHost):[];if(audit.length!==53)throw new Error('בדיקת עיצוב: נמצאו '+audit.length+' דפים במקום 53')}
  function printWorkbook(theme){prepareWorkbook(theme);requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()))}
  addEventListener('afterprint',()=>{printHost.innerHTML='';printHost.className='';delete document.documentElement.dataset.printTheme});
  prev.onclick=()=>{if(idx>0){idx--;render();scrollTo(0,0)}};next.onclick=()=>{if(idx<52){idx++;render();scrollTo(0,0)}};printOriginal.onclick=()=>printWorkbook('original');printColor.onclick=()=>printWorkbook('color');printMono.onclick=()=>printWorkbook('mono');
  addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&idx<52){idx++;render()}if(e.key==='ArrowRight'&&idx>0){idx--;render()}});render();
 }catch(e){app.className='loading err';app.textContent='שגיאה בטעינת החוברת:\n'+e.message;counter.textContent='שגיאה';printOriginal.disabled=true;printColor.disabled=true;printMono.disabled=true;console.error(e)}
})();
</script>
</body></html>
