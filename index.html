function updateCurrent(i,replaceHash=true){idx=Math.max(0,Math.min(pages.length-1,i));counter.textContent='עמוד '+(idx+1)+' / '+pages.length;prev.disabled=idx===0;next.disabled=idx===pages.length-1;app.querySelectorAll('.scroll-sheet.is-current').forEach(e=>e.classList.remove('is-current'));app.querySelector('.scroll-sheet[data-index="'+idx+'"]')?.classList.add('is-current');if(replaceHash)history.replaceState(null,'',location.pathname+location.search+'#'+(idx+1));warmAround(idx)}
function warmAround(i){const conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;const ahead=conn?.saveData?1:/2g/.test(conn?.effectiveType||'')?1:3;const targets=[];for(let d=1;d<=ahead;d++){targets.push(i+d);if(d===1)targets.push(i-d)}const run=()=>targets.filter(x=>x>=0&&x<pages.length).forEach(x=>loadPage(x).catch(()=>{}));if('requestIdleCallback'in window)requestIdleCallback(run,{timeout:900});else setTimeout(run,120)}
function setupObservers(){currentObserver?.disconnect();lazyObserver?.disconnect();if(!('IntersectionObserver'in window)){for(let i=0;i<Math.min(4,pages.length);i++)loadPage(i).catch(()=>{});return}currentObserver=new IntersectionObserver(entries=>{const v=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(v.length){const i=Number(v[0].target.dataset.index);if(Number.isFinite(i)&&i!==idx)updateCurrent(i,true)}},{rootMargin:'-22% 0px -48% 0px',threshold:[0,.25,.5,.75]});lazyObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){const i=Number(e.target.dataset.index);loadPage(i).catch(err=>console.error(err))}}),{rootMargin:'1600px 0px 1600px 0px',threshold:0});app.querySelectorAll('.scroll-sheet').forEach(e=>{currentObserver.observe(e);lazyObserver.observe(e)})}
function scrollToPage(i){const target=Math.max(0,Math.min(pages.length-1,i));updateCurrent(target,true);loadPage(target).catch(()=>{});app.querySelector('.scroll-sheet[data-index="'+target+'"]')?.scrollIntoView({behavior:'smooth',block:'start'})}
async function refreshCurrentIfChanged(){const meta=pages[idx],old=pageCache.get(meta.file)?.hash,current=await fetchText(meta.file,true),h=hashText(current);if(old&&h===old)return false;await loadPage(idx,true);return true}
async function prepareWorkbook(theme){syncStatus.textContent='מכין את כל '+pages.length+' הדפים…';setActionsDisabled(true);closeMenus();await sharedStylesPromise;await Promise.all(pages.map(p=>loadPageStyle(p)));const fresh=new Array(pages.length),queue=pages.map((_,i)=>i);let done=0;const workers=Array.from({length:6},async()=>{while(queue.length){const i=queue.shift();fresh[i]=(await getPage(i,true)).markup;done++;if(done%4===0)syncStatus.textContent='מכין '+done+' / '+pages.length}});await Promise.all(workers);printHost.className=theme==='mono'?'book-theme-mono':theme==='color'?'book-theme-color':'book-theme-original';printHost.innerHTML=fresh.map(m=>'<article class="print-page">'+m+'</article>').join('');applyDesign(printHost);const mjEngine=await mathReady(20000);if(mjEngine){await typeset(printHost);if(/\\\(|\\\[/.test(printHost.textContent||''))await typeset(printHost)}else{console.warn('MathJax engine unavailable — continuing without typeset')}syncStatus.textContent='מוכן · '+pages.length+' דפים'}
async function printWorkbook(theme){try{await prepareWorkbook(theme);requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()))}catch(e){alert('שגיאה בהכנת החוברת: '+e.message);console.error(e)}finally{setActionsDisabled(false)}}
function pdfFilename(theme){return 'משפט-פיתגורס-'+(theme==='mono'?'שחור-לבן':theme==='color'?'צבע':'מקורי')+'.pdf'}
async function downloadPdf(theme){try{await prepareWorkbook(theme);await ensurePdfLibraries();printHost.classList.add('pdf-rendering');printHost.setAttribute('aria-hidden','false');await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const nodes=[...printHost.querySelectorAll('.print-page')],{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});if(nodes.length!==pages.length)throw new Error('מספר דפים לא תקין');for(let i=0;i<nodes.length;i++){syncStatus.textContent='יוצר PDF · '+(i+1)+' / '+nodes.length;const canvas=await window.html2canvas(nodes[i],{scale:1.25,useCORS:true,allowTaint:false,backgroundColor:'#fff',logging:false});if(i)pdf.addPage('a4','portrait');pdf.addImage(canvas.toDataURL('image/jpeg',.9),'JPEG',0,0,210,297,undefined,'FAST');canvas.width=canvas.height=1;await new Promise(r=>setTimeout(r,0))}pdf.save(pdfFilename(theme));syncStatus.textContent='ההורדה הושלמה'}catch(e){alert('שגיאה בהורדת PDF: '+e.message);syncStatus.textContent='הורדת PDF נכשלה';console.error(e)}finally{printHost.classList.remove('pdf-rendering');printHost.setAttribute('aria-hidden','true');printHost.innerHTML='';printHost.className='';setActionsDisabled(false)}}
async function checkForChanges(){sweepMath();try{const fresh=await fetchJson('WORKBOOK_MANIFEST.json',true);if(JSON.stringify(fresh.pages||[])!==JSON.stringify(manifest.pages||[])){location.reload();return}if(await refreshCurrentIfChanged())syncStatus.textContent='העמוד עודכן אוטומטית'}catch(e){console.debug('sync check skipped',e)}}
async function boot(){manifest=await fetchJson('WORKBOOK_MANIFEST.json',true);pages=Array.isArray(manifest.pages)?manifest.pages:[];if(!pages.length)throw new Error('המניפסט אינו מכיל דפים');if(Number(manifest.totalPages)&&Number(manifest.totalPages)!==pages.length)throw new Error('מספר הדפים במניפסט אינו תואם');idx=Math.max(0,Math.min(pages.length-1,(parseInt(location.hash.slice(1),10)||1)-1));buildShells();setupObservers();updateCurrent(idx,false);syncStatus.textContent='טוען את העמוד הראשון…';await loadPage(idx);syncStatus.textContent='מוכן · שאר הדפים נטענים לפי הגלילה';if(idx>0)setTimeout(()=>app.querySelector('.scroll-sheet[data-index="'+idx+'"]')?.scrollIntoView({block:'start'}),20);warmAround(idx);setInterval(()=>{if(document.visibilityState==='visible')checkForChanges()},120000)}
colorMode.onclick=e=>{e.stopPropagation();toggleMode('color')};monoMode.onclick=e=>{e.stopPropagation();toggleMode('mono')};colorMenu.onclick=e=>e.stopPropagation();monoMenu.onclick=e=>e.stopPropagation();document.addEventListener('click',closeMenus);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});prev.onclick=()=>scrollToPage(idx-1);next.onclick=()=>scrollToPage(idx+1);printColor.onclick=()=>printWorkbook('color');printMono.onclick=()=>printWorkbook('mono');downloadColor.onclick=()=>downloadPdf('color');downloadMono.onclick=()=>downloadPdf('mono');addEventListener('resize',()=>requestAnimationFrame(fitLoaded),{passive:true});addEventListener('orientationchange',()=>setTimeout(()=>fitLoaded(),120),{passive:true});addEventListener('afterprint',()=>{printHost.innerHTML='';printHost.className='';syncStatus.textContent='מוכן · טעינה חכמה פעילה'});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')scrollToPage(idx+1);else if(e.key==='ArrowRight')scrollToPage(idx-1)});
window.PythagorasWorkbookInternal={printOriginal:()=>printWorkbook('original'),downloadOriginal:()=>downloadPdf('original')};
boot().catch(e=>{app.className='loading err';app.textContent='שגיאה בטעינת החוברת:\n'+e.message;counter.textContent='שגיאה';syncStatus.textContent='טעינה נכשלה';setActionsDisabled(true);console.error(e)});
})();
