name: Unpack Pythagoras source
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack canonical standalone project
        shell: bash
        run: |
          set -euo pipefail
          test -f pythagoras-bootstrap.tar.gz
          tar -xzf pythagoras-bootstrap.tar.gz
          if [ ! -f package.json ] && [ -f pythagoras/package.json ]; then
            cp -a pythagoras/. .
            rm -rf pythagoras
          fi
          test -f SOURCE_OF_TRUTH.md
          test -f package.json
          test "$(find src/pages -name main.html -type f | wc -l)" -eq 53
          rm -rf .bootstrap .static-deploy pythagoras-bootstrap.tar.gz package-lock.json .github/workflows/unpack-pythagoras.yml
      - name: Commit canonical 53-page project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: unpack canonical standalone 53-page Pythagoras project"
          git push origin HEAD:main
