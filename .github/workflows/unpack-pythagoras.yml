name: Unpack canonical Pythagoras source
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for complete canonical bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .canonical/READY ]; then
            echo "Canonical bundle not complete yet; skipping unpack."
            exit 0
          fi
      - name: Unpack exact canonical standalone project
        if: ${{ hashFiles('.canonical/READY') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat .canonical/part-* > /tmp/pythagoras.b64
          base64 -d /tmp/pythagoras.b64 > /tmp/pythagoras.tar.gz
          echo "27f5e0b2519bc2136a5d585ef8ad8c37dd2bb38e3e0721bf0c3ba537d81a88f7  /tmp/pythagoras.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/pythagoras.tar.gz
          test -f SOURCE_OF_TRUTH.md
          test -f package.json
          test "$(find src/pages -name main.html -type f | wc -l)" -eq 53
          test "$(find src/shared/fonts -name '*.woff2' -type f -size +1000c | wc -l)" -ge 4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('.canonical/READY') != '' }}
        with:
          node-version: '24'
          cache: npm
      - name: Install and verify canonical project
        if: ${{ hashFiles('.canonical/READY') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run build
          npm run typecheck
          test -f package-lock.json
      - name: Commit clean canonical 53-page project
        if: ${{ hashFiles('.canonical/READY') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish canonical standalone 53-page Pythagoras project"
          git push origin HEAD:main
