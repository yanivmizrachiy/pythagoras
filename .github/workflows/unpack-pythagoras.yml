name: Unpack Pythagoras source
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and verify canonical project
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap
          cat .bootstrap/part-* | base64 --decode > pythagoras-bootstrap.tar.gz
          echo "21bf79b073e9df21f9982c3c616a89fa974d07c080ef69bf7ce1187a6de78457  pythagoras-bootstrap.tar.gz" | sha256sum -c -
          tar -xzf pythagoras-bootstrap.tar.gz
          rm -rf .bootstrap pythagoras-bootstrap.tar.gz .github/workflows/unpack-pythagoras.yml
          test -f SOURCE_OF_TRUTH.md
          test "$(find src/pages -name main.html -type f | wc -l)" -eq 53
          npm run check
          npm run check:runtime
      - name: Commit canonical 53-page project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import standalone 53-page Pythagoras workbook"
          git push origin HEAD:main
